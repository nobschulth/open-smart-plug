<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Smart Plug</title>
<style>
body {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin: 0;
    background: #111;
    background: #1A1A1A;
    background: linear-gradient(180deg,rgba(26, 26, 26, 1) 0%, rgba(17, 17, 17, 1) 100%);
    color: white;
    font-family: sans-serif;
    height: 100vh;
}
h1 {
    background: linear-gradient(45deg, #99c1f1, #764ba2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-size: 50px;
    font-weight: 900;
    font-family: Arial, sans-serif;
    background-clip: text;
}
p {
    font-size: 20px;
    font-weight: 500;
    font-family: Arial, sans-serif;
}
</style>
</head>
<body>
    <div class="container">
        <h1>Restarting...</h1>
        <p>You can exit this wifi now.</p>
    </div>

</body>
